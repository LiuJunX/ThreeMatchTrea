<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match3 Core 系统依赖关系图</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    text-align: center;
    padding: 18px 20px 12px;
    background: linear-gradient(180deg, rgba(26,26,46,0.97) 0%, rgba(26,26,46,0.85) 80%, rgba(26,26,46,0) 100%);
    pointer-events: none;
  }

  #header h1 {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  #header .subtitle {
    font-size: 14px;
    color: #90909a;
    letter-spacing: 0.5px;
  }

  #header .subtitle span {
    display: inline-block;
    margin: 0 6px;
    padding: 2px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    font-variant-numeric: tabular-nums;
  }

  #legend {
    position: absolute;
    top: 90px;
    left: 20px;
    z-index: 10;
    background: rgba(30, 30, 50, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 18px;
    backdrop-filter: blur(8px);
    min-width: 200px;
  }

  #legend h3 {
    font-size: 13px;
    font-weight: 600;
    color: #a0a0b0;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 7px;
    font-size: 13px;
    color: #d0d0d8;
  }

  .legend-item:last-child { margin-bottom: 0; }

  .legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    margin-right: 10px;
    flex-shrink: 0;
    box-shadow: 0 0 6px rgba(0,0,0,0.3);
  }

  .legend-count {
    margin-left: auto;
    color: #707080;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  #controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }

  #controls button {
    background: rgba(30, 30, 50, 0.92);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #c0c0cc;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  #controls button:hover {
    background: rgba(50, 50, 80, 0.95);
    border-color: rgba(255,255,255,0.2);
    color: #ffffff;
  }

  #tooltip {
    position: absolute;
    z-index: 20;
    background: rgba(20, 20, 40, 0.96);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 12px 16px;
    pointer-events: none;
    display: none;
    max-width: 320px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  #tooltip .tt-name {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 4px;
  }

  #tooltip .tt-layer {
    font-size: 12px;
    color: #909098;
    margin-bottom: 8px;
  }

  #tooltip .tt-deps {
    font-size: 12px;
    color: #b0b0bc;
    line-height: 1.5;
  }

  #tooltip .tt-deps strong {
    color: #d0d0dc;
  }

  #graph {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Match3 Core 系统依赖关系图</h1>
  <div class="subtitle">
    <span>25 个系统</span>
    <span>5 个层级</span>
    <span>0 个循环依赖</span>
  </div>
</div>

<div id="legend">
  <h3>层级图例</h3>
  <div class="legend-item">
    <div class="legend-dot" style="background:#4CAF50;"></div>
    Layer 0 - 零依赖（叶节点）
    <span class="legend-count">9</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#2196F3;"></div>
    Layer 1 - 基础组合
    <span class="legend-count">6</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#FF9800;"></div>
    Layer 2 - 核心逻辑
    <span class="legend-count">5</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f44336;"></div>
    Layer 3 - 高层策略
    <span class="legend-count">5</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#9C27B0;"></div>
    Layer 4 - 顶层协调
    <span class="legend-count">2</span>
  </div>
</div>

<div id="controls">
  <button onclick="fitGraph()">适应窗口</button>
  <button onclick="togglePhysics()">切换物理</button>
  <button onclick="toggleLayout()">切换布局</button>
</div>

<div id="tooltip"></div>

<div id="graph"></div>

<script>
(function() {
  // ── Layer colors ──
  var COLORS = {
    0: { bg: '#4CAF50', border: '#388E3C', highlight: '#66BB6A', font: '#ffffff' },
    1: { bg: '#2196F3', border: '#1565C0', highlight: '#42A5F5', font: '#ffffff' },
    2: { bg: '#FF9800', border: '#E65100', highlight: '#FFB74D', font: '#1a1a2e' },
    3: { bg: '#f44336', border: '#c62828', highlight: '#ef5350', font: '#ffffff' },
    4: { bg: '#9C27B0', border: '#6A1B9A', highlight: '#BA68C8', font: '#ffffff' }
  };

  // ── Node definitions: [id, label, layer, level (for hierarchy)] ──
  var nodeDefs = [
    // Layer 0
    ['LevelObjectiveSystem',    'LevelObjectiveSystem',    0, 4],
    ['StandardScoreSystem',     'StandardScoreSystem',     0, 4],
    ['ProjectileSystem',        'ProjectileSystem',        0, 4],
    ['BombComboHandler',        'BombComboHandler',        0, 4],
    ['LockScheduler',           'LockScheduler',           0, 4],
    ['BombGenerator',           'BombGenerator',           0, 4],
    ['RuleBasedSpawnModel',     'RuleBasedSpawnModel',     0, 4],
    ['StandardTileGenerator',   'StandardTileGenerator',   0, 4],
    ['StandardInputSystem',     'StandardInputSystem',     0, 4],

    // Layer 1
    ['CoverSystem',             'CoverSystem',             1, 3],
    ['GroundSystem',            'GroundSystem',            1, 3],
    ['RealtimeRefillSystem',    'RealtimeRefillSystem',    1, 3],
    ['GravityTargetResolver',   'GravityTargetResolver',   1, 3],
    ['BombEffectRegistry',      'BombEffectRegistry',      1, 3],
    ['BoardInitializer',        'BoardInitializer',        1, 3],

    // Layer 2
    ['ClassicMatchFinder',      'ClassicMatchFinder',      2, 2],
    ['RealtimeGravitySystem',   'RealtimeGravitySystem',   2, 2],
    ['ExplosionSystem',         'ExplosionSystem',         2, 2],
    ['ColorBombSessionManager', 'ColorBombSessionManager', 2, 2],
    ['StandardMatchProcessor',  'StandardMatchProcessor',  2, 2],

    // Layer 3
    ['DeadlockDetectionSystem', 'DeadlockDetectionSystem', 3, 1],
    ['BoardShuffleSystem',      'BoardShuffleSystem',      3, 1],
    ['PowerUpHandler',          'PowerUpHandler',          3, 1],
    ['WeightedMoveSelector',    'WeightedMoveSelector',    3, 1],
    ['RandomMoveSelector',      'RandomMoveSelector',      3, 1],

    // Layer 4
    ['SimulationOrchestrator',  'SimulationOrchestrator',  4, 0],
    ['SimulationEngine',        'SimulationEngine',        4, 0]
  ];

  // ── Edge definitions: [from, to] — from depends on to ──
  var edgeDefs = [
    // Layer 1 → Layer 0
    ['CoverSystem',             'LevelObjectiveSystem'],
    ['GroundSystem',            'LevelObjectiveSystem'],
    ['RealtimeRefillSystem',    'RuleBasedSpawnModel'],
    ['BoardInitializer',        'StandardTileGenerator'],
    ['BoardInitializer',        'LevelObjectiveSystem'],

    // Layer 2 → Layer 0/1
    ['ClassicMatchFinder',      'BombGenerator'],
    ['RealtimeGravitySystem',   'GravityTargetResolver'],
    ['ExplosionSystem',         'CoverSystem'],
    ['ExplosionSystem',         'GroundSystem'],
    ['ExplosionSystem',         'LevelObjectiveSystem'],
    ['ExplosionSystem',         'LockScheduler'],
    ['ColorBombSessionManager', 'CoverSystem'],
    ['ColorBombSessionManager', 'GroundSystem'],
    ['ColorBombSessionManager', 'LevelObjectiveSystem'],
    ['ColorBombSessionManager', 'LockScheduler'],
    ['StandardMatchProcessor',  'StandardScoreSystem'],
    ['StandardMatchProcessor',  'CoverSystem'],
    ['StandardMatchProcessor',  'GroundSystem'],
    ['StandardMatchProcessor',  'BombEffectRegistry'],

    // Layer 3 → Layer 0/1/2
    ['DeadlockDetectionSystem', 'ClassicMatchFinder'],
    ['BoardShuffleSystem',      'ClassicMatchFinder'],
    ['PowerUpHandler',          'StandardScoreSystem'],
    ['PowerUpHandler',          'BombComboHandler'],
    ['PowerUpHandler',          'BombEffectRegistry'],
    ['PowerUpHandler',          'CoverSystem'],
    ['PowerUpHandler',          'GroundSystem'],
    ['PowerUpHandler',          'ExplosionSystem'],
    ['PowerUpHandler',          'ProjectileSystem'],
    ['PowerUpHandler',          'ColorBombSessionManager'],
    ['WeightedMoveSelector',    'ClassicMatchFinder'],
    ['RandomMoveSelector',      'ClassicMatchFinder'],

    // Layer 4 → everything
    ['SimulationOrchestrator',  'RealtimeGravitySystem'],
    ['SimulationOrchestrator',  'RealtimeRefillSystem'],
    ['SimulationOrchestrator',  'ClassicMatchFinder'],
    ['SimulationOrchestrator',  'StandardMatchProcessor'],
    ['SimulationOrchestrator',  'PowerUpHandler'],
    ['SimulationOrchestrator',  'ProjectileSystem'],
    ['SimulationOrchestrator',  'ExplosionSystem'],
    ['SimulationOrchestrator',  'LevelObjectiveSystem'],
    ['SimulationOrchestrator',  'ColorBombSessionManager'],
    ['SimulationEngine',        'SimulationOrchestrator'],
    ['SimulationEngine',        'DeadlockDetectionSystem'],
    ['SimulationEngine',        'BoardShuffleSystem'],
    ['SimulationEngine',        'LockScheduler'],
    ['SimulationEngine',        'ClassicMatchFinder']
  ];

  // ── Build vis.js DataSets ──
  var nodes = new vis.DataSet(nodeDefs.map(function(n) {
    var c = COLORS[n[2]];
    return {
      id: n[0],
      label: n[1],
      level: n[3],
      layer: n[2],
      color: {
        background: c.bg,
        border: c.border,
        highlight: { background: c.highlight, border: c.border },
        hover: { background: c.highlight, border: c.border }
      },
      font: {
        color: c.font,
        size: 14,
        face: '"Segoe UI", "Microsoft YaHei", sans-serif',
        bold: { color: c.font }
      },
      shape: 'box',
      borderWidth: 2,
      borderWidthSelected: 3,
      margin: { top: 10, bottom: 10, left: 14, right: 14 },
      shadow: {
        enabled: true,
        color: 'rgba(0,0,0,0.3)',
        size: 8,
        x: 2,
        y: 3
      }
    };
  }));

  var edges = new vis.DataSet(edgeDefs.map(function(e, i) {
    return {
      id: i,
      from: e[0],
      to: e[1],
      arrows: { to: { enabled: true, scaleFactor: 0.7, type: 'arrow' } },
      color: {
        color: 'rgba(255,255,255,0.15)',
        highlight: 'rgba(255,255,255,0.6)',
        hover: 'rgba(255,255,255,0.4)'
      },
      width: 1.5,
      smooth: {
        enabled: true,
        type: 'cubicBezier',
        forceDirection: 'vertical',
        roundness: 0.4
      }
    };
  }));

  // ── Build dependency map for tooltip ──
  var depMap = {};
  edgeDefs.forEach(function(e) {
    if (!depMap[e[0]]) depMap[e[0]] = [];
    depMap[e[0]].push(e[1]);
  });

  // ── Layer name map ──
  var LAYER_NAMES = {
    0: 'Layer 0 - 零依赖',
    1: 'Layer 1 - 基础组合',
    2: 'Layer 2 - 核心逻辑',
    3: 'Layer 3 - 高层策略',
    4: 'Layer 4 - 顶层协调'
  };

  // ── Network options ──
  var container = document.getElementById('graph');
  var options = {
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'UD',
        sortMethod: 'directed',
        levelSeparation: 140,
        nodeSpacing: 180,
        treeSpacing: 200,
        blockShifting: true,
        edgeMinimization: true,
        parentCentralization: true
      }
    },
    physics: {
      enabled: true,
      hierarchicalRepulsion: {
        centralGravity: 0.0,
        springLength: 160,
        springConstant: 0.01,
        nodeDistance: 200,
        damping: 0.09,
        avoidOverlap: 0.5
      },
      stabilization: {
        enabled: true,
        iterations: 200,
        updateInterval: 25
      }
    },
    interaction: {
      hover: true,
      tooltipDelay: 100,
      navigationButtons: false,
      keyboard: {
        enabled: true,
        speed: { x: 10, y: 10, zoom: 0.03 }
      },
      zoomView: true,
      dragView: true,
      multiselect: true
    },
    nodes: {
      shapeProperties: {
        borderRadius: 6
      }
    },
    edges: {
      selectionWidth: 2,
      hoverWidth: 1.5
    }
  };

  var network = new vis.Network(container, { nodes: nodes, edges: edges }, options);

  // ── Tooltip ──
  var tooltip = document.getElementById('tooltip');

  network.on('hoverNode', function(params) {
    var nodeId = params.node;
    var nodeData = nodes.get(nodeId);
    var deps = depMap[nodeId] || [];
    var layerLabel = LAYER_NAMES[nodeData.layer];

    var html = '<div class="tt-name">' + nodeData.label + '</div>';
    html += '<div class="tt-layer">' + layerLabel + '</div>';
    if (deps.length > 0) {
      html += '<div class="tt-deps"><strong>依赖 (' + deps.length + '):</strong><br>';
      html += deps.map(function(d) { return '  \u2192 ' + d; }).join('<br>');
      html += '</div>';
    } else {
      html += '<div class="tt-deps" style="color:#4CAF50;">无外部依赖（叶节点）</div>';
    }

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
  });

  network.on('blurNode', function() {
    tooltip.style.display = 'none';
  });

  // Track mouse for tooltip position
  container.addEventListener('mousemove', function(e) {
    var x = e.clientX + 16;
    var y = e.clientY + 16;
    // Keep tooltip in viewport
    var tw = tooltip.offsetWidth || 250;
    var th = tooltip.offsetHeight || 100;
    if (x + tw > window.innerWidth - 10) x = e.clientX - tw - 10;
    if (y + th > window.innerHeight - 10) y = e.clientY - th - 10;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });

  // ── Highlight connected nodes on select ──
  network.on('selectNode', function(params) {
    var selectedId = params.nodes[0];
    var connectedEdges = network.getConnectedEdges(selectedId);
    var connectedNodes = network.getConnectedNodes(selectedId);

    // Dim all edges first
    edges.forEach(function(edge) {
      edges.update({
        id: edge.id,
        color: {
          color: connectedEdges.indexOf(edge.id) >= 0
            ? 'rgba(255,255,255,0.7)'
            : 'rgba(255,255,255,0.05)'
        },
        width: connectedEdges.indexOf(edge.id) >= 0 ? 2.5 : 0.5
      });
    });
  });

  network.on('deselectNode', function() {
    // Restore all edges
    edges.forEach(function(edge) {
      edges.update({
        id: edge.id,
        color: {
          color: 'rgba(255,255,255,0.15)',
          highlight: 'rgba(255,255,255,0.6)',
          hover: 'rgba(255,255,255,0.4)'
        },
        width: 1.5
      });
    });
  });

  // ── After stabilization, fit ──
  network.once('stabilizationIterationsDone', function() {
    network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
  });

  // ── Global controls ──
  var physicsOn = true;
  var hierarchical = true;

  window.fitGraph = function() {
    network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  };

  window.togglePhysics = function() {
    physicsOn = !physicsOn;
    network.setOptions({ physics: { enabled: physicsOn } });
  };

  window.toggleLayout = function() {
    hierarchical = !hierarchical;
    if (hierarchical) {
      network.setOptions({
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            levelSeparation: 140,
            nodeSpacing: 180,
            treeSpacing: 200
          }
        },
        physics: {
          enabled: true,
          hierarchicalRepulsion: {
            centralGravity: 0.0,
            springLength: 160,
            springConstant: 0.01,
            nodeDistance: 200,
            damping: 0.09
          }
        }
      });
    } else {
      network.setOptions({
        layout: {
          hierarchical: { enabled: false }
        },
        physics: {
          enabled: true,
          barnesHut: {
            gravitationalConstant: -3000,
            centralGravity: 0.3,
            springLength: 200,
            springConstant: 0.04,
            damping: 0.09,
            avoidOverlap: 0.2
          }
        }
      });
    }
  };
})();
</script>
</body>
</html>
